name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually from GitHub

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web
        working-directory: ./client
        run: |
          npm install
          npm run build

      - name: Sync Capacitor iOS
        working-directory: ./client
        run: |
          npm install @capacitor/ios@7
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App (No Code Signing)
        working-directory: ./client/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package to IPA
        working-directory: ./client/ios/App
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/App.app Payload/
          zip -r TrackFit.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackFit-iOS
          path: client/ios/App/TrackFit.ipa