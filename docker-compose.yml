services:
  postgres:
    image: postgres:17-alpine
    container_name: trackfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackfit}
      POSTGRES_DB: ${POSTGRES_DB:-trackfit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trackfit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackfit-pgdata:
